name: Deploy UI Library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build library and showcase
        run: npm run build

      - name: Verify package files
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/style.css
          test -f dist/legacy-classic/theme.css
          test -f dist/legacy-classic/theme-system.css
          grep -F 'import "./style.css";' dist/index.js
          npm pack --dry-run

      - name: Smoke test Git dependency consumer
        env:
          UI_SHA: ${{ github.sha }}
        run: |
          SMOKE="$RUNNER_TEMP/terry-ui-consumer"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y
          npm install --ignore-scripts react@19.1.1 react-dom@19.1.1 vite@7.1.3
          npm install "git+https://github.com/terry-xu-2077/Terry_React_UI_Library.git#$UI_SHA"
          test -f node_modules/terry-react-ui-library/dist/index.js
          test -f node_modules/terry-react-ui-library/dist/index.d.ts
          test -f node_modules/terry-react-ui-library/dist/style.css
          cat > index.html <<'EOF'
          <div id="app"></div><script type="module" src="/main.js"></script>
          EOF
          cat > main.js <<'EOF'
          import { BoolSwitch, Select } from 'terry-react-ui-library';
          console.log(BoolSwitch, Select);
          EOF
          npx vite build
          find dist -name '*.css' -print -quit | grep .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
