<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Terry React UI Library</title>
<link rel="stylesheet" href="./src/style.css" />
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--tc-bg);color:var(--tc-text)}button,input{font:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:24px;padding:0 24px;background:color-mix(in srgb,var(--tc-bg) 94%,transparent);border-bottom:1px solid var(--tc-border-color);backdrop-filter:blur(14px)}.brand{font-weight:700}.tag{padding:4px 9px;border:1px solid var(--tc-border-color);border-radius:999px;color:var(--tc-text-muted);font-size:12px}.appearance{margin-left:auto;display:flex;gap:4px}.appearance button{height:28px;min-width:64px;border:var(--tc-border);border-radius:5px;background:var(--tc-panel);color:var(--tc-text-muted)}.appearance button.active{background:var(--tc-accent);color:var(--tc-text-bright)}.main{width:min(1080px,calc(100% - 32px));margin:28px auto 80px}.intro h1{margin:0 0 6px;font-size:28px}.intro p{margin:0;color:var(--tc-text-muted)}.section{margin-top:24px;border:1px solid var(--tc-border-color);background:var(--tc-surface);box-shadow:0 12px 28px var(--tc-shadow)}.section-title{padding:11px 14px;border-bottom:1px solid var(--tc-border-color);font-weight:600}.body{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:24px 40px}.item{display:grid;grid-template-columns:120px 1fr;align-items:center;min-height:58px}.label{font-size:12px;color:var(--tc-text-muted)}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}.main{width:calc(100% - 20px)}}
</style>
</head>
<body>
<div id="shell" class="shell tc-theme" data-mode="dark">
<header class="topbar"><div class="brand">Terry React UI Library</div><span class="tag">Base Style</span><div class="appearance"><button id="darkMode" class="active">Dark</button><button id="lightMode">Light</button></div></header>
<main class="main">
<div class="intro"><h1>Base Style</h1><p>共享基础样式、组件与视觉图标系统。</p></div>
<section class="section"><div class="section-title">Components</div><div class="body grid">
<div class="item"><span class="label">TextField</span><div class="tc-control tc-text"><input value="示例文本" /></div></div>
<div class="item"><span class="label">BoolSwitch</span><button class="tc-control tc-bool is-on toggle"><span class="tc-bool-knob">ON 开</span></button></div>
<div class="item"><span class="label">Select</span><div class="tc-control tc-select"><button class="tc-select-button"><span>Alpha</span><i class="tc-chevron"></i></button></div></div>
<div class="item"><span class="label">Slider</span><div class="tc-control tc-slider"><input class="tc-range" type="range" min="0" max="100" value="42" /><input class="tc-number" type="number" value="42" /></div></div>
<div class="item"><span class="label">MultiSelect</span><div class="tc-control tc-multi"><button class="tc-select-button"><span>Alpha, Gamma</span><i class="tc-chevron"></i></button></div></div>
<div class="item"><span class="label">Status</span><div class="actions"><span class="tc-status-pill tone-active">Active</span><span class="tc-status-pill tone-warning">Warning</span><span class="tc-status-pill tone-danger">Danger</span></div></div>
</div></section>
<section class="section"><div class="section-title">Actions</div><div class="body actions"><button class="tc-button">Primary Action</button><button class="tc-button" disabled>Disabled</button></div></section>
</main></div>
<script>
const shell=document.getElementById('shell'),dark=document.getElementById('darkMode'),light=document.getElementById('lightMode');
function setMode(mode){shell.dataset.mode=mode;document.documentElement.dataset.tcMode=mode;dark.classList.toggle('active',mode==='dark');light.classList.toggle('active',mode==='light')}
dark.onclick=()=>setMode('dark');light.onclick=()=>setMode('light');document.querySelectorAll('.toggle').forEach(button=>button.onclick=()=>{button.classList.toggle('is-on');button.querySelector('.tc-bool-knob').textContent=button.classList.contains('is-on')?'ON 开':'OFF 关'});setMode('dark');
</script>
</body>
</html>
